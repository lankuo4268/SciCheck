const payload=e=>e.payload||e.result||{};
const hasCandidate=p=>p.candidate!==null&&p.candidate!==undefined;
const current=()=>DATA.cases.find(c=>c.id===activeId);
const methodName={quad_plain:'普通积分 · quad',quad_breakpoints:'断点积分 · quad',root_newton:'粗 Newton',root_brent:'严格 Brent',root_direct:'结构化直接路线',ls_np32:'NumPy · float32',ls_np64:'NumPy · float64',ls_decimal_high:'Decimal · 高精度',ode_euler10:'Euler · 10步',ode_dop853:'DOP853',ode_closed_naive:'朴素闭式',ode_closed_stable:'稳定闭式'};
function getEvents(item){return item.id==='ode_stability'?item.events.slice(odeGroup*3,odeGroup*3+3):item.events||[]}
function view(item){
 const events=getEvents(item);let receipt=item.receipt||{},budget=item.budget;
 if(item.id==='ode_stability'){const c=item.raw?.cases?.[odeGroup*2];receipt=c?.verify_pass||receipt;budget=c?.budget_after||budget}
 const candidates=events.map(payload).filter(p=>hasCandidate(p)&&!p.idempotent_hit);
 const initial=candidates.find(p=>p.exact_ok===false)||candidates[0];
 const final=candidates.find(p=>p.run_id===receipt.run_id)||candidates.find(p=>p.exact_ok===true)||candidates[candidates.length-1];
 return{events,receipt,budget,initial,final};
}
function badge(text,cls=''){return `<span class="badge ${cls}">${esc(text)}</span>`}
function judgement(p,e){
 const tag=e?.tag||'';
 if(p.error||p.ok===false)return{label:p.error?.toLowerCase().includes('budget')?'预算拒绝':'调用拒绝',cls:'bad'};
 if(/method_lookup/.test(tag))return{label:'调用完成',cls:''};
 if(p.idempotent_hit)return{label:'幂等重放',cls:''};
 if(p.exact_ok===true||p.verdict==='VERIFIED_PASS'||p.conclusion==='VERIFIED_PASS')return{label:/verify/.test(tag)?'回执一致 · 通过':'核验通过',cls:'ok'};
 if(p.exact_ok===false||p.verdict==='VERIFIED_INCORRECT')return{label:/verify/.test(tag)?'回执一致 · 未通过':'未满足容差',cls:'bad'};
 if(p.consistent===true)return{label:'回执一致',cls:''};
 return{label:hasCandidate(p)?'待核验':'记录步骤',cls:''};
}
function actionLabel(p,e){return methodName[p.action]||p.params?.action_id||(/method_lookup/.test(e?.tag||'')?'读取结构卡片':/verify_run/.test(e?.tag||'')?'核对持久化回执':e?.tag||'记录事件')}
function card(p,label){if(!p)return'';const j=judgement(p);return `<div class="result-card ${j.cls==='ok'?'pass':j.cls==='bad'?'fail':''}"><div class="result-top"><span class="result-label">${esc(label)}</span>${badge(j.label,j.cls)}</div><div class="candidate ${Array.isArray(p.candidate)?'vector':''}">${esc(number(p.candidate))}</div><div class="method">${esc(methodName[p.action]||p.action||'原记录候选')}</div></div>`}
function sourceBlock(item){const src=UI_SOURCE_OVERRIDES[item.id]||item.sourceHash;const hashes={...(item.sourceHashes||{})};if(src?.file&&src?.sha256)hashes[src.file]=src.sha256;return Object.entries(hashes).map(([f,h])=>`<div class="hash">${esc(f)}<br>${esc(h)}</div>`).join('<br>')||'<p>本记录未提供来源哈希。</p>'}
function renderNav(){let previous='';document.getElementById('caseTabs').innerHTML=DATA.cases.map(c=>{const m=META[c.id],heading=m.group!==previous?`<div class="nav-caption">${esc(m.group)}</div>`:'';previous=m.group;return heading+`<button class="case-nav ${c.id===activeId?'active':''}" data-tab="${esc(c.id)}" aria-selected="${c.id===activeId}"><span class="nav-icon">${m.icon}</span><span><span class="nav-name">${esc(c.short)}</span><span class="nav-meta">${esc(m.brief)}</span></span><span class="nav-arrow">›</span></button>`}).join('')}
function budgetHTML(v,item){const labels={solve_launches:'求解启动',func_evals:'函数求值',tool_requests:'工具请求',model_requests:'业务账本模型请求',wall_seconds:'账本墙钟秒数'};if(!v.budget)return'<p class="empty">该记录没有预算卡片。</p>';const entries=Object.entries(v.budget).filter(([k,x])=>labels[k]&&x&&Number.isFinite(x.total)&&Number.isFinite(x.spent));return `<div class="budget-list">${entries.map(([k,x])=>`<div class="resource"><div class="resource-top"><span>${labels[k]}</span><span class="count">${x.spent} / ${x.total}${k==='wall_seconds'?' s':''}</span></div><div class="track"><i class="${x.spent>=x.total?'full':''}" style="width:${x.total?Math.min(100,x.spent/x.total*100):0}%"></i></div></div>`).join('')}</div><p class="budget-note">${item.id==='ode_stability'?'预算对应当前所选问题的诊断修复任务。':'各资源独立计量，不相加。'} 账本模型请求为 0 不代表宿主没有模型调用。</p>`}
function render(){
 const item=current(),m=META[item.id],v=view(item),host=item.id.startsWith('agh_'),receipt=v.receipt;
 const result=v.initial?`<div class="result-grid">${card(v.initial,'初始实际候选')}<div class="result-arrow">→</div>${card(v.final,'核验后候选')}</div>`:`<div class="status-summary"><span class="small-label">${item.category}</span><strong class="state-raw">${esc(item.stateFinal||'无候选记录')}</strong><p>${esc(m.desc)}</p></div>`;
 const steps=v.events.length?`<ol class="steps">${v.events.map((e,i)=>{const p=payload(e),j=judgement(p,e);return `<li class="step" data-step="${i}" tabindex="0" role="button" aria-label="查看步骤 ${i+1}"><span class="step-num">${String(i+1).padStart(2,'0')}</span><div class="step-body"><div class="step-first"><span class="step-title">${esc(actionLabel(p,e))}</span>${badge(j.label,j.cls)}</div><div class="step-method">${esc(e.tag)}</div>${hasCandidate(p)?`<div class="step-value">candidate = ${esc(number(p.candidate))}</div>`:p.error?`<div class="step-value">${esc(p.error)}</div>`:''}</div></li>`}).join('')}</ol>`:'<div class="trace-warning">该案例只有终态与异常摘要，没有逐步轨迹。完整原始字段可在下方展开。</div>';
 const finalStatus=item.stateFinal||'无状态记录';
 document.getElementById('caseContainer').innerHTML=`<div class="case-heading"><div>${badge(host?'AGH 宿主调用':m.group==='科学计算'?'本地科学计算记录':'约束与异常记录',host?'host':'')}<h2>${esc(m.title)}</h2><p class="case-description">${esc(m.desc)}</p></div><div class="case-number">CASE ${String(DATA.cases.indexOf(item)+1).padStart(2,'0')} / ${String(DATA.cases.length).padStart(2,'0')}</div></div>
 ${item.id==='ode_stability'?`<div class="subcases">${['增长 y′ = y','微小系数 a = 10⁻¹²','大时间原点 t₀ = 10¹²'].map((t,i)=>`<button class="subcase ${odeGroup===i?'active':''}" data-subcase="${i}">${t}</button>`).join('')}</div>`:''}
 <section class="panel"><div class="panel-top"><span class="panel-title">${v.initial?'候选对照 · 原始容差保持不变':'保留终态 · 不填造候选'}</span>${badge(finalStatus==='VERIFIED_PASS'?'最终核验通过':finalStatus,finalStatus==='VERIFIED_PASS'?'ok':'warn')}</div>${result}<div class="result-foot"><i class="dot"></i><span>${esc(m.reason||'状态按原记录展示；能力拒绝、预算停止和执行异常均不计为数值通过。')}</span></div></section>
 <div class="middle-grid"><section class="panel"><div class="section-heading"><h3>真实执行轨迹</h3><span>${v.events.length?v.events.length+' STEPS':'摘要记录'}</span></div>${steps}<div class="progress"><div id="replayProgress" style="width:0"></div></div><div class="player"><button class="btn primary" data-replay="play" ${v.events.length?'':'disabled'}>▶ 播放记录</button><button class="btn" data-replay="prev" ${v.events.length?'':'disabled'}>← 上一步</button><button class="btn" data-replay="next" ${v.events.length?'':'disabled'}>下一步 →</button><button class="btn quiet" data-replay="reset" ${v.events.length?'':'disabled'}>重置</button><span class="player-note" id="stepCounter">离线回放 · 不新增调用</span></div><div class="replay-text" id="replayStatus" role="status">${v.events.length?'点击任一步查看记录，或播放完整过程。':'没有逐步轨迹，保留摘要。'}</div></section>
 <aside class="panel"><div class="section-heading"><h3>资源与回执</h3><span>RECORDED</span></div>${budgetHTML(v,item)}<div class="receipt"><div class="receipt-title">${receipt.run_id?'持久化核验回执':'原记录终态'}</div><div class="receipt-state">${badge(receipt.consistent===true?'回执一致':receipt.run_id?'已有回执':'摘要',receipt.consistent===true?'ok':'')}<b>${esc(receipt.conclusion||receipt.receipt_verdict||finalStatus)}</b></div>${receipt.run_id?`<p>${esc(receipt.run_id)}</p>`:''}</div></aside></div>
 <details class="panel evidence" id="evidence"><summary>来源与原始证据<span>SHA-256 · JSON 导出 · 会话说明 ＋</span></summary><div class="evidence-body"><div class="evidence-grid"><div><h4>来源文件与 SHA-256</h4>${sourceBlock(item)}</div><div><h4>记录来源与会话</h4><p>${esc(item.session||'未记录')}</p><p>${esc(item.sessionNote||'本地记录，无公开宿主会话链接。')}</p>${item.sessionHref?`<a href="${esc(item.sessionHref)}" target="_blank" rel="noopener">打开已核实会话链接 ↗</a>`:''}<p>费用 UNKNOWN。官方轨迹请通过 AGH 界面手动导出。</p></div></div><details><summary>展开当前案例原始 JSON</summary><pre class="json-box" id="rawJson">${esc(JSON.stringify(item.raw||item,null,2))}</pre></details><div class="evidence-tools"><button class="btn" data-export="${esc(item.id)}">↓ 导出当前 JSON</button><button class="btn quiet" data-copy="${esc(item.id)}">复制 JSON</button><span class="copy-status" id="copyStatus" role="status"></span></div><details id="stepEvidence"><summary>当前步骤原始字段</summary><pre class="json-box" id="stepJson">尚未选择步骤。</pre></details></div></details>`;
 renderNav();document.getElementById('caseCount').textContent=String(DATA.cases.length).padStart(2,'0');
}
function stop(){if(timer)clearInterval(timer);timer=null;playing=false;const b=document.querySelector('[data-replay=play]');if(b)b.textContent='▶ 播放记录'}
function showStep(index){const events=getEvents(current());if(!events.length)return;pointer=Math.max(0,Math.min(index,events.length-1));document.querySelectorAll('[data-step]').forEach(el=>el.classList.toggle('current',Number(el.dataset.step)===pointer));document.getElementById('stepCounter').textContent=`步骤 ${pointer+1} / ${events.length}`;document.getElementById('replayProgress').style.width=((pointer+1)/events.length*100)+'%';const e=events[pointer],p=payload(e);document.getElementById('replayStatus').textContent=actionLabel(p,e)+' · '+judgement(p,e).label+' · 不新增计算';document.getElementById('stepJson').textContent=JSON.stringify(e,null,2)}
document.addEventListener('click',async event=>{
 const tab=event.target.closest('[data-tab]');if(tab){stop();activeId=tab.dataset.tab;pointer=0;render();return}
 const sub=event.target.closest('[data-subcase]');if(sub){stop();odeGroup=Number(sub.dataset.subcase);pointer=0;render();return}
 const step=event.target.closest('[data-step]');if(step){stop();showStep(Number(step.dataset.step));return}
 const replay=event.target.closest('[data-replay]');if(replay&&!replay.disabled){const mode=replay.dataset.replay,events=getEvents(current());if(mode==='play'){if(playing){stop();return}playing=true;replay.textContent='Ⅱ 暂停';showStep(0);timer=setInterval(()=>{if(pointer>=events.length-1){stop();document.getElementById('replayStatus').textContent='回放完成 · 全部步骤来自已有记录';return}showStep(pointer+1)},1100)}else{stop();if(mode==='next')showStep(pointer+1);if(mode==='prev')showStep(pointer-1);if(mode==='reset'){pointer=0;showStep(0);document.getElementById('replayStatus').textContent='已回到第一步 · 不新增计算'}}return}
 if(event.target.closest('#focusToggle')){document.body.classList.toggle('focus-mode');const b=document.getElementById('focusToggle'),on=document.body.classList.contains('focus-mode');b.setAttribute('aria-pressed',String(on));b.textContent=on?'▣ 退出演示':'▣ 演示模式';return}
 const exp=event.target.closest('[data-export]');if(exp){const c=current(),url=URL.createObjectURL(new Blob([JSON.stringify(c.raw||c,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=c.id+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
 if(event.target.closest('[data-copy]')){const status=document.getElementById('copyStatus');try{if(!navigator.clipboard)throw Error('clipboard unavailable');await navigator.clipboard.writeText(JSON.stringify(current().raw||current(),null,2));status.textContent='已复制当前原始 JSON'}catch{status.textContent='复制受限，请使用 JSON 导出';}return}
});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-step]')){event.preventDefault();event.target.click()}});
render();
</script>
</body></html>
